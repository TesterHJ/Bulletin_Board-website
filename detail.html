<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 상세 보기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .wood-board {
      background: radial-gradient(circle at 50% 30%, #a27b5c 0%, #7d5a3c 60%, #563d27 100%);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <nav class="flex gap-6 text-sm font-medium">
        <a href="index.html" class="text-[#2D3436] font-bold border-b-2 border-[#D9480F] pb-1">게시판</a>
        <a href="edit.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">새 메모</a>
      </nav>
    </div>

    <!-- 우측 프로필/인증 컨테이너 -->
    <div id="userProfileContainer"></div>
  </header>

  <!-- 본문 컨텐츠 -->
  <main class="wood-board flex-1 p-4 md:p-8 flex flex-col items-center">
    <div class="max-w-6xl w-full">

      <div class="flex items-center justify-between text-xs text-white/90 mb-4 px-1">
        <a href="index.html" class="hover:underline flex items-center gap-1.5 font-medium">
          <span>←</span> 게시판으로 돌아가기
        </a>
        <div class="text-white/70 space-x-2 text-[11px]">
          <span id="memoNumber">메모 로딩 중...</span>
          <span>·</span>
          <span id="memoViews">조회 0</span>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

        <!-- 좌측 메모 본문 카드 -->
        <article id="memoArticleCard" class="lg:col-span-8 bg-[#FCFBF7] rounded-xl shadow-xl p-8 md:p-10 flex flex-col justify-between border border-[#EBE8DF] min-h-[580px] transition-colors">
          <div>
            <div class="flex items-center justify-end mb-4">
              <div class="flex items-center gap-3 text-xs text-gray-400">
                <button type="button" onclick="navigator.clipboard.writeText(window.location.href); alert('링크가 복사되었습니다!');" class="hover:text-gray-700 transition">공유</button>
                <button type="button" onclick="alert('신고가 접수되었습니다.');" class="hover:text-gray-700 transition">신고</button>
              </div>
            </div>

            <h1 id="memoTitle" class="text-2xl md:text-3xl font-extrabold text-[#212529] mb-4 tracking-tight leading-snug">
              제목을 불러오는 중입니다...
            </h1>

            <div class="flex items-center gap-3 pb-6 mb-6 border-b border-[#E9ECEF]">
              <div id="authorAvatar" class="w-10 h-10 rounded-full bg-[#F59F00]/20 text-[#D9480F] flex items-center justify-center font-bold text-sm">
                ?
              </div>
              <div>
                <p id="memoAuthor" class="text-sm font-bold text-gray-800">-</p>
                <p id="memoDate" class="text-xs text-gray-400">-</p>
              </div>
            </div>

            <div id="memoContent" class="space-y-4 text-[15px] leading-relaxed text-[#343A40] whitespace-pre-line">
              내용을 불러오고 있습니다...
            </div>
          </div>

          <!-- 하단 버튼 영역 ('마음' -> '공감' 변경) -->
          <div class="flex items-center justify-between pt-8 mt-8 border-t border-[#E9ECEF]">
            <button id="likeBtn" type="button" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-[#FFD8D8] text-[#E03131] hover:bg-[#FFF5F5] transition text-xs font-semibold shadow-sm active:scale-95">
              <span>♡</span> 공감 <span id="likeCount">0</span>
            </button>
            <div class="flex items-center gap-2">
              <a id="editLink" href="#" class="px-3.5 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition text-xs font-semibold shadow-sm">
                수정
              </a>
              <a href="index.html" class="flex items-center gap-1.5 px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition text-xs font-semibold shadow-sm">
                <span>≡</span> 목록으로
              </a>
            </div>
          </div>
        </article>

        <!-- 우측 댓글 -->
        <aside class="lg:col-span-4 bg-white rounded-xl shadow-xl p-5 border border-gray-100 flex flex-col min-h-[580px]">
          <div class="flex items-center justify-between pb-3 border-b border-gray-100 mb-4">
            <h2 class="font-bold text-gray-900 text-sm">댓글 <span id="commentTotalCount" class="text-[#D9480F]">0</span></h2>
            <span class="text-xs text-gray-400">등록순</span>
          </div>

          <div class="bg-[#F8F9FA] rounded-lg p-3 border border-gray-200 mb-4">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="text-[11px] font-semibold text-gray-700">댓글 남기기</span>
            </div>
            <textarea 
              id="commentInput" 
              rows="3" 
              maxlength="300" 
              placeholder="따뜻한 말을 남겨 주세요." 
              class="w-full bg-transparent text-xs text-gray-700 focus:outline-none resize-none placeholder:text-gray-400"
            ></textarea>
            <div class="flex items-center justify-between pt-2 border-t border-gray-200/80 mt-1">
              <span id="commentCharCount" class="text-[10px] text-gray-400">0/300</span>
              <button id="submitCommentBtn" type="button" class="bg-[#B04A36] hover:bg-[#973C2A] text-white px-3 py-1 rounded text-xs font-medium transition active:scale-95">
                댓글 등록
              </button>
            </div>
          </div>

          <div id="commentList" class="space-y-4 flex-1 overflow-y-auto pr-1">
            <div class="text-center text-xs text-gray-400 py-8">등록된 댓글이 없습니다.</div>
          </div>
        </aside>

      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="detail.js"></script>
</body>
</html>
