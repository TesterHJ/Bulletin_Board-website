<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 게시물 통합 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .wood-board {
      background: radial-gradient(circle at 50% 30%, #a27b5c 0%, #7d5a3c 60%, #563d27 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 상단 헤더: nav는 auth.js에서 동적으로 단일 렌더링 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <nav class="flex gap-6 text-sm font-medium"></nav>
    </div>

    <!-- 우측 프로필/인증 영역 -->
    <div id="userProfileContainer"></div>
  </header>

  <!-- 관리자 대시보드 본문 -->
  <main class="wood-board flex-1 p-6 md:p-10 flex flex-col items-center">
    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-2xl p-8 border border-stone-200">
      
      <div class="flex items-center justify-between pb-6 mb-6 border-b border-gray-100">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900">게시물 통합 관리</h1>
          <p class="text-xs text-gray-500 mt-1">부적절한 게시물을 검토하고 강제 삭제할 수 있습니다.</p>
        </div>
        <span class="text-xs font-bold text-[#E03131] bg-[#FFF5F5] border border-[#FFA8A8] px-3 py-1 rounded-full">
          관리자 모드
        </span>
      </div>

      <!-- 게시물 테이블 목록 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-gray-50/70 text-gray-500 font-bold border-b border-gray-100">
              <th class="py-3 px-4">식별 번호</th>
              <th class="py-3 px-4">제목</th>
              <th class="py-3 px-4">작성자</th>
              <th class="py-3 px-4">등록일</th>
              <th class="py-3 px-4 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="adminMemoList" class="divide-y divide-gray-100">
            <tr>
              <td colspan="5" class="text-center py-12 text-gray-400">
                게시물을 불러오는 중입니다...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
