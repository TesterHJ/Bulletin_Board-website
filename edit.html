<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 작성 및 다듬기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .wood-board {
      background: radial-gradient(circle at 50% 30%, #a27b5c 0%, #7d5a3c 60%, #563d27 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.4);
    }
    .pin {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #ff8787 0%, #e03131 70%, #9b1c1c 100%);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 1. 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <!-- 하드코딩된 '관리' 링크 제거: auth.js가 관리자일 때만 자동 주입 -->
      <nav class="flex gap-6 text-sm font-medium">
        <a href="index.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">게시판</a>
        <a href="edit.html" class="text-[#2D3436] font-bold border-b-2 border-[#D9480F] pb-1">새 메모</a>
      </nav>
    </div>

    <!-- 우측 프로필/인증 영역 -->
    <div id="userProfileContainer"></div>
  </header>

  <!-- 2. 메인 작업 영역 -->
  <main class="wood-board flex-1 p-6 md:p-10 flex flex-col items-center justify-center">
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-stone-200 my-auto">

      <!-- 상단 모드 탭 -->
      <div class="flex border-b border-gray-200 px-6 pt-4 text-sm font-bold gap-6 bg-stone-50/50">
        <button id="tabNew" type="button" class="pb-3 -mb-[1px] border-b-2 transition">새 메모 붙이기</button>
        <button id="tabEdit" type="button" class="pb-3 -mb-[1px] border-b-2 transition">내 메모 다듬기</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-8 p-6 md:p-8 items-start">
        <!-- 좌측: 입력 폼 (7컬럼) -->
        <form id="memoForm" class="md:col-span-7 space-y-5">
          <h2 id="pageTitle" class="text-xl font-extrabold text-gray-900">새 메모 붙이기</h2>

          <!-- 제목 입력 -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label for="titleInput" class="text-xs font-bold text-gray-700">제목</label>
              <span id="titleCounter" class="text-[11px] text-gray-400">0 / 40</span>
            </div>
            <input 
              type="text" 
              id="titleInput" 
              maxlength="40" 
              placeholder="제목을 입력해 주세요." 
              class="w-full text-xs p-3 border rounded-lg border-gray-300 focus:outline-none focus:border-[#B04A36] transition"
              required 
            />
          </div>

          <!-- 내용 입력 -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label for="contentInput" class="text-xs font-bold text-gray-700">내용</label>
              <span id="contentCounter" class="text-[11px] text-gray-400">0 / 2,000</span>
            </div>
            <textarea 
              id="contentInput" 
              rows="6" 
              maxlength="2000" 
              placeholder="마음에 남길 이야기를 적어보세요." 
              class="w-full text-xs p-3 border rounded-lg border-gray-300 focus:outline-none focus:border-[#B04A36] transition resize-none leading-relaxed"
              required
            ></textarea>
          </div>

          <!-- 메모지 색상 선택 -->
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-2">메모지 색상</label>
            <div class="flex items-center gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="memoColor" value="#FEF9C3" checked class="hidden peer" />
                <span class="w-7 h-7 rounded-full bg-[#FEF9C3] border-2 border-stone-300 peer-checked:border-[#B04A36] peer-checked:ring-2 peer-checked:ring-[#B04A36]/20 block transition"></span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="memoColor" value="#DCFCE7" class="hidden peer" />
                <span class="w-7 h-7 rounded-full bg-[#DCFCE7] border-2 border-stone-300 peer-checked:border-[#B04A36] peer-checked:ring-2 peer-checked:ring-[#B04A36]/20 block transition"></span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="memoColor" value="#E0F2FE" class="hidden peer" />
                <span class="w-7 h-7 rounded-full bg-[#E0F2FE] border-2 border-stone-300 peer-checked:border-[#B04A36] peer-checked:ring-2 peer-checked:ring-[#B04A36]/20 block transition"></span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="memoColor" value="#FCE7F3" class="hidden peer" />
                <span class="w-7 h-7 rounded-full bg-[#FCE7F3] border-2 border-stone-300 peer-checked:border-[#B04A36] peer-checked:ring-2 peer-checked:ring-[#B04A36]/20 block transition"></span>
              </label>
            </div>
          </div>

          <!-- 하단 버튼 영역 -->
          <div class="flex items-center justify-between pt-4 border-t border-gray-100">
            <button 
              type="button" 
              id="openDeleteModalBtn" 
              class="text-xs font-semibold text-red-500 hover:text-red-700 transition"
            >
              메모 삭제
            </button>
            <div class="flex items-center gap-2 ml-auto">
              <a href="index.html" class="px-4 py-2 border rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 transition">취소</a>
              <button 
                type="submit" 
                class="bg-[#B04A36] hover:bg-[#973C2A] text-white text-xs font-bold px-5 py-2 rounded-lg shadow transition"
              >
                메모 붙이기
              </button>
            </div>
          </div>
        </form>

        <!-- 우측: 실시간 미리보기 (5컬럼) -->
        <div class="md:col-span-5 flex flex-col">
          <span class="text-xs font-bold text-gray-500 mb-3 block">미리보기</span>
          <div 
            id="previewCard" 
            style="background-color: #FEF9C3;" 
            class="rounded-lg shadow-lg p-6 relative flex flex-col justify-between min-h-[260px] border border-stone-200/50 transition-colors"
          >
            <div class="pin absolute -top-1.5 left-1/2 -translate-x-1/2"></div>
            <div>
              <h3 id="previewTitle" class="font-bold text-base text-gray-900 mb-2 leading-snug break-words">
                제목을 입력해 주세요
              </h3>
              <p id="previewContent" class="text-xs text-gray-700 leading-relaxed break-words whitespace-pre-line">
                내용을 입력하면 여기에 실시간으로 표시됩니다.
              </p>
            </div>
            <div class="pt-4 mt-6 border-t border-black/5 flex items-center justify-between text-[11px] text-gray-500">
              <span>작성자</span>
              <span>방금 전</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- 삭제 확인 모달 -->
  <div id="deleteModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center">
      <h3 class="font-bold text-base text-gray-900 mb-2">메모를 삭제할까요?</h3>
      <p id="deleteModalDesc" class="text-xs text-gray-600 mb-6 leading-relaxed">삭제한 글은 복구할 수 없습니다.</p>
      <div class="flex gap-2">
        <button id="closeDeleteModalBtn" type="button" class="flex-1 py-2 border rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 transition">취소</button>
        <button id="confirmDeleteBtn" type="button" class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition">삭제하기</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="edit.js"></script>
</body>
</html>
