<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 따뜻한 이야기 벽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .wood-board {
      background: radial-gradient(circle at 50% 30%, #a27b5c 0%, #7d5a3c 60%, #563d27 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.4);
    }
    .pin {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #ff8787 0%, #e03131 70%, #9b1c1c 100%);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <nav class="flex gap-6 text-sm font-medium">
        <a href="index.html" class="text-[#2D3436] font-bold border-b-2 border-[#D9480F] pb-1">게시판</a>
        <a href="edit.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">새 메모</a>
      </nav>
    </div>

    <!-- 우측 프로필/인증 영역 -->
    <div id="userProfileContainer"></div>
  </header>

  <!-- 메인 게시판 영역 -->
  <main class="wood-board flex-1 p-6 md:p-10 flex flex-col items-center">
    <div class="max-w-6xl w-full">

      <!-- 상단 바: 좌측(제목/설명/정렬필터) & 우측(검색/새 메모) -->
      <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-4 mb-8">
        <div>
          <h1 class="text-2xl font-extrabold text-white drop-shadow-sm">나무 벽 게시판</h1>
          <p id="memoCountText" class="text-xs text-white/80 mt-1 mb-3">오늘 등록된 이야기를 불러오는 중입니다...</p>
          
          <!-- 정렬 드롭다운 선택 필터 -->
          <div class="flex items-center gap-2">
            <label for="sortSelect" class="text-xs text-white/90 font-medium">정렬 기준:</label>
            <div class="relative">
              <select 
                id="sortSelect" 
                class="appearance-none bg-white/90 hover:bg-white text-gray-800 text-xs font-semibold pl-3 pr-8 py-1.5 rounded-lg border border-stone-300 shadow-sm outline-none cursor-pointer transition focus:ring-2 focus:ring-[#B04A36]/40"
              >
                <option value="recent">최근 작성순</option>
                <option value="oldest">가장 오래된순</option>
                <option value="views">조회수순</option>
                <option value="likes">공감수순</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-600 text-xs">
                ▼
              </div>
            </div>
          </div>
        </div>

        <!-- 검색창 및 새 메모 버튼 -->
        <div class="flex items-center gap-3 w-full md:w-auto">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="제목, 내용, 작성자 검색..." 
            class="bg-white/90 focus:bg-white text-xs px-4 py-2 rounded-full border border-stone-200 outline-none w-full md:w-64 shadow-sm transition placeholder:text-stone-400"
          />
          <a 
            href="edit.html" 
            class="whitespace-nowrap bg-[#B04A36] hover:bg-[#973C2A] text-white text-xs font-bold px-4 py-2 rounded-full shadow transition"
          >
            + 새 메모
          </a>
        </div>
      </div>

      <!-- 메모 포스트잇 그리드 -->
      <div id="memoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="col-span-full text-center text-white/80 py-20">
          메모를 불러오는 중입니다...
        </div>
      </div>

    </div>
  </main>

  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
