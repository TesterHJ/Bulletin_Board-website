<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 우리의 작은 이야기 판</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .wood-board {
      background-color: #7d5a3c;
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.4)),
        url('img/memosite bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5);
    }
    .pin {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #ff8787 0%, #e03131 70%, #9b1c1c 100%);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <nav class="flex gap-6 text-sm font-medium"></nav>
    </div>

    <!-- 우측 프로필/인증 영역 -->
    <div id="userProfileContainer"></div>
  </header>

  <!-- 메인 게시판 영역 -->
  <main class="wood-board flex-1 p-6 md:p-10 flex flex-col items-center">
    <div class="max-w-6xl w-full flex flex-col min-h-[calc(100vh-140px)] justify-between">

      <!-- 상단 컨트롤 및 메모 그리드 -->
      <div>
        <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-4 mb-8">
          <div>
            <!-- 타이틀 및 카운트 텍스트 크기 확대 -->
            <h1 class="text-3xl md:text-4xl font-extrabold text-white drop-shadow-md tracking-tight">
              나무판 게시판
            </h1>
            <p id="memoCountText" class="text-sm md:text-base font-medium text-white/90 mt-1.5 mb-4 drop-shadow-sm">
              오늘 등록된 이야기를 불러오는 중입니다...
            </p>
            
            <!-- 정렬 세그먼트 칩 -->
            <div id="sortPillsContainer" class="inline-flex items-center gap-1.5 bg-black/25 p-1 rounded-full backdrop-blur-sm border border-white/10 shadow-inner">
              <button 
                type="button" 
                data-sort="recent" 
                class="sort-pill px-3 py-1 rounded-full text-xs font-bold transition duration-150 bg-[#B04A36] text-white shadow-sm"
              >
                최신순
              </button>
              <button 
                type="button" 
                data-sort="oldest" 
                class="sort-pill px-3 py-1 rounded-full text-xs font-medium transition duration-150 text-white/80 hover:text-white hover:bg-white/10"
              >
                오래된순
              </button>
              <button 
                type="button" 
                data-sort="views" 
                class="sort-pill px-3 py-1 rounded-full text-xs font-medium transition duration-150 text-white/80 hover:text-white hover:bg-white/10"
              >
                조회순
              </button>
              <button 
                type="button" 
                data-sort="likes" 
                class="sort-pill px-3 py-1 rounded-full text-xs font-medium transition duration-150 text-white/80 hover:text-white hover:bg-white/10"
              >
                공감순
              </button>
            </div>
          </div>

          <!-- 검색창 및 새 메모 버튼 (id="btnNewMemoMain" 추가) -->
          <div class="flex items-center gap-3 w-full md:w-auto">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="제목, 내용, 작성자 검색..." 
              class="bg-white/90 focus:bg-white text-xs px-4 py-2.5 rounded-full border border-stone-200 outline-none w-full md:w-64 shadow-sm transition placeholder:text-stone-400"
            />
            <a 
              href="edit.html" 
              id="btnNewMemoMain"
              class="whitespace-nowrap bg-[#B04A36] hover:bg-[#973C2A] text-white text-xs font-bold px-4 py-2.5 rounded-full shadow transition"
            >
              + 새 메모
            </a>
          </div>
        </div>

        <!-- 메모 포스트잇 그리드 (한 줄에 4개씩) -->
        <div id="memoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
          <div class="col-span-full text-center text-white/80 py-20">
            메모를 불러오는 중입니다...
          </div>
        </div>
      </div>

      <!-- 하단 알약형(Pill) 페이지네이션 트랙 -->
      <nav id="paginationContainer" class="flex items-center justify-center mt-10 mb-4 select-none hidden" aria-label="메모 페이지 이동">
        <div class="inline-flex items-center gap-1 bg-black/25 p-1 rounded-full backdrop-blur-sm border border-white/10 shadow-inner">
          <button 
            id="btnPrevPage" 
            type="button" 
            class="px-2.5 py-1 rounded-full text-xs font-bold transition duration-150 text-white/80 hover:text-white hover:bg-white/10 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed"
            title="이전 페이지"
          >
            ‹
          </button>
          <div id="pageNumberButtons" class="inline-flex items-center gap-1"></div>
          <button 
            id="btnNextPage" 
            type="button" 
            class="px-2.5 py-1 rounded-full text-xs font-bold transition duration-150 text-white/80 hover:text-white hover:bg-white/10 disabled:opacity-20 disabled:hover:bg-transparent disabled:cursor-not-allowed"
            title="다음 페이지"
          >
            ›
          </button>
        </div>
      </nav>

    </div>
  </main>

  <script src="auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
