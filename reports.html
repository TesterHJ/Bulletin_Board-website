<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무메모 - 신고 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-[#2D3436] min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-white border-b border-[#E9ECEF] sticky top-0 z-50 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-8">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[#2D3436]">
        <span class="w-7 h-7 rounded-full bg-[#82C91E]/20 text-[#5C940D] flex items-center justify-center text-sm font-black">▲</span>
        나무메모
      </a>
      <nav class="flex gap-6 text-sm font-medium">
        <a href="index.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">게시판</a>
        <a href="edit.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">새 메모</a>
        <a href="admin.html" class="text-[#868E96] hover:text-[#2D3436] transition-colors pb-1">관리</a>
        <a href="reports.html" class="text-[#2D3436] font-bold border-b-2 border-[#D9480F] pb-1">신고</a>
      </nav>
    </div>
    <div id="userProfileContainer"></div>
  </header>

  <!-- 본문 컨텐츠 -->
  <main class="flex-1 p-6 md:p-10 max-w-6xl w-full mx-auto">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900">신고 접수 내역</h1>
        <p id="reportSummaryText" class="text-xs text-gray-500 mt-1">사용자들이 신고한 메모 목록을 확인하고 관리합니다.</p>
      </div>
      <button onclick="location.reload()" class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-xs font-semibold hover:bg-gray-50 transition shadow-sm">
        새로고침
      </button>
    </div>

    <!-- 신고 메모 리스트 테이블/카드 래퍼 -->
    <div id="reportListContainer" class="space-y-4">
      <div class="text-center py-20 text-gray-400 text-xs">신고 내역을 불러오는 중입니다...</div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="reports.js"></script>
</body>
</html>
